<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Лінійні алгоритми, міні</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800&family=Nunito:wght@600;700;800&display=swap">
<style>
:root{--bg:#eef2f7;--panel:#fff;--ink:#1b2433;--muted:#5b6678;--line:#d5dce7;--sys:#2f6fe4;--sys-bg:#e3ecfd;--app:#e0711d;--ok:#1f9d55;--ok-bg:#ddf5e7;--bad:#d23b3b;--bad-bg:#fbe3e3;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;--body:"Nunito","Segoe UI",system-ui,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121822;--panel:#1b2330;--ink:#e9eef6;--muted:#9aa6b8;--line:#2d3848;--sys:#6f9ff5;--sys-bg:#1d2c48;--ok:#4cc985;--ok-bg:#163a27;--bad:#f07272;--bad-bg:#43191c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121822;--panel:#1b2330;--ink:#e9eef6;--muted:#9aa6b8;--line:#2d3848;--sys:#6f9ff5;--sys-bg:#1d2c48;--ok:#4cc985;--ok-bg:#163a27;--bad:#f07272;--bad-bg:#43191c;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1.08rem;line-height:1.5;min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}
h1,h2{font-family:var(--display);line-height:1.2;margin:0;text-wrap:balance}
h1{font-size:1.6rem}h2{font-size:1.2rem}
p{margin:0}
button{font:inherit;cursor:pointer;color:inherit}
.top{position:sticky;top:0;z-index:3;background:var(--bg);padding:12px 16px 8px;display:grid;gap:6px}
.top .row{display:flex;justify-content:space-between;font-weight:800;font-size:.9rem;color:var(--muted)}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2f6fe4,#8a3fd1);transition:width .4s}
main{flex:1;width:100%;max-width:520px;margin:0 auto;padding:4px 16px 20px}
.scr{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px 18px;display:grid;gap:16px;animation:in .4s ease-out}
@keyframes in{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(720deg)}}
@keyframes floaty{50%{transform:translateY(-6px)}}
@keyframes bob{50%{transform:translateY(-3px)}}
.shake{animation:shake .35s}
.emo{font-size:3rem;line-height:1;text-align:center;animation:floaty 3s ease-in-out infinite}
.tag{font-size:.8rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--app)}
.def{background:var(--sys-bg);border-radius:14px;padding:14px 16px;display:grid;gap:6px}
.btn{border:0;border-radius:14px;padding:16px;font-weight:800;font-size:1.1rem;background:var(--sys);color:#fff;width:100%}
.opts{display:grid;gap:10px}
.opt{border:2px solid var(--line);border-radius:14px;padding:14px 16px;text-align:left;font-weight:700;background:var(--panel)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.fb{font-weight:800}
.field{display:grid;gap:4px;font-weight:800}
.field input{font:inherit;font-weight:700;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink)}
.field input:focus{outline:none;border-color:var(--sys)}
.send{border-radius:12px;padding:12px 14px;font-weight:800;display:grid;gap:8px}
.send.wait{background:var(--sys-bg)}.send.ok{background:var(--ok-bg);color:var(--ok)}.send.bad{background:var(--bad-bg);color:var(--bad)}.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.sheet{background:var(--bg);border-radius:14px;padding:12px 14px;display:grid;gap:4px;font-weight:600}
.sheet b{font-family:var(--display);font-size:.9rem}
.sheet ol{margin:0;padding-left:1.5em;display:grid;gap:2px}
.sheet u{text-decoration:none;color:var(--app);font-weight:800}
.opt ol{margin:4px 0 0;padding-left:1.4em;font-weight:600}
.blk{display:inline-block;padding:6px 12px;border-radius:8px;color:#fff;font-weight:800;font-size:.95rem;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18);background:#8a3fd1}
.blk.t{background:#4c97ff}.blk.ev{background:#ffbf00;color:#5c4300;border-radius:16px 16px 8px 8px}
.blk .v{background:#fff;color:#333;border-radius:99px;padding:0 7px;margin-left:4px}
.code{display:grid;gap:3px;justify-items:start}
.pic{display:grid;place-items:center;background:var(--bg);border-radius:14px;padding:12px}
.pic svg{max-width:100%;height:auto}
.order{display:grid;gap:8px}
.order .done{display:grid;gap:6px;background:var(--bg);border-radius:14px;padding:10px;min-height:60px;counter-reset:o}
.order .done div{background:var(--ok-bg);border:2px solid var(--ok);border-radius:10px;padding:8px 12px;font-weight:700}
.order .done div::before{counter-increment:o;content:counter(o) ") ";color:var(--ok)}
.order .pool{display:grid;gap:8px}
.order .pool button{border:2px solid var(--line);background:var(--panel);border-radius:12px;padding:12px;font-weight:700;text-align:left}
.mz{width:200px;height:200px;display:block;margin:0 auto;border-radius:14px}
.walking .bodyg{animation:bob .25s ease-in-out infinite}
.big{font-family:var(--display);font-weight:800;font-size:5rem;line-height:1;text-align:center;color:var(--sys)}
.confetti{position:fixed;top:-20px;width:10px;height:14px;border-radius:2px;z-index:50;pointer-events:none;animation:fall linear forwards}
.ctl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cmd{border:0;border-radius:14px;padding:12px 4px;color:#fff;font-weight:800;font-size:.95rem;display:grid;gap:2px;justify-items:center;box-shadow:inset 0 -4px 0 rgba(0,0,0,.2)}
.cmd span{font-size:1.6rem;line-height:1}
.cmd:active{transform:translateY(2px)}
.cmd.f{background:#8a3fd1}.cmd.l{background:#2f6fe4}.cmd.r{background:#e0711d}
.cmd.tf{background:#4c97ff}.cmd.tl{background:#2f6fe4}.cmd.tr{background:#e0711d}
.ctl2{display:grid;grid-template-columns:1fr 2fr;gap:8px}
.undo{border:2px solid var(--line);background:var(--panel);border-radius:14px;font-weight:800;padding:12px}
.go{border:0;border-radius:14px;background:var(--ok);color:#fff;font-weight:800;font-size:1.1rem;padding:12px}
.go:disabled,.cmd:disabled,.undo:disabled{opacity:.5}
.prog{display:flex;flex-wrap:wrap;gap:5px;min-height:46px;background:var(--bg);border-radius:12px;padding:8px;align-content:flex-start}
.prog .pc{border-radius:8px;color:#fff;font-weight:800;min-width:34px;height:30px;display:grid;place-items:center;font-size:1rem;animation:pop2 .2s}
.prog .pc.run{outline:3px solid #ffd400;outline-offset:1px}
.prog .ph{color:var(--muted);font-weight:700;font-size:.9rem;align-self:center}
@keyframes pop2{from{transform:scale(.5)}to{transform:none}}
.pcf{background:#8a3fd1}.pcl{background:#2f6fe4}.pcr{background:#e0711d}
.stars{font-weight:800;text-align:center}
.bmz{width:100%;max-width:300px;height:auto;display:block;margin:0 auto;border-radius:14px}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:0 16px 18px}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>

<footer>Учитель: Сидорчук Н.В.</footer>

    const f2=el('label',{class:'field'},'Клас');const i2=el('input',{autocomplete:'off',placeholder:'Наприклад: 5-А'});i2.value=U.cls;f2.append(i2);
    const fb=el('p',{class:'fb bad'});const b=el('button',{class:'btn'},'Почати');

      if(!k){fb.textContent='Напиши свій клас.';bump(i2);return;}

  else if(s.k==='q'){pts.tot++;c.append(el('div',{style:'display:grid;gap:12px;font-weight:800;font-size:1.12rem'},s.q));
    const o=el('div',{class:'opts'});const fb=el('p',{class:'fb'});const nx=nextBtn();nx.hidden=true;const right=s.o[0];
    shuffle(s.o).forEach(t=>{const b=el('button',{class:'opt'},t);b.onclick=()=>{$$('.opt',o).forEach(x=>x.disabled=true);
      [...o.children].forEach((x,i)=>{if(x._t===right)x.classList.add('right');});
      if(t===right){award(1);fb.className='fb ok';fb.textContent='Правильно! '+s.why;}else{b.classList.add('wrong');bump(b);fb.className='fb bad';fb.textContent='Не зовсім. '+s.why;}
      nx.hidden=false;};b._t=t;o.append(b);});

  else if(s.k==='order'){pts.tot++;c.append(el('h2',{},s.q),el('p',{style:'color:var(--muted)'},'Натискай кроки по черзі.'));
    const w=el('div',{class:'order'});const done=el('div',{class:'done'});const pool=el('div',{class:'pool'});w.append(done,pool);c.append(w);
    const fb=el('p',{class:'fb'});const nx=nextBtn();nx.hidden=true;c.append(fb,nx);let k=0,err=0;
    shuffle(s.steps).forEach(t=>{const b=el('button',{},t);b.onclick=()=>{if(t===s.steps[k]){k++;b.remove();done.append(el('div',{},t));
        if(k===s.steps.length){award(err?.5:1);fb.className='fb ok';fb.textContent=err?`Готово! Помилок: ${err}.`:'Ідеально! Це лінійний алгоритм.';nx.hidden=false;}}

  else if(s.k==='maze'){pts.tot++;c.append(el('h2',{},s.q));const m=s.map;const C=50;

    let start,fin;for(let y=0;y<4;y++)for(let x=0;x<4;x++){const ch=m[y][x];if(ch==='#'){[[14,16,11],[34,30,12]].forEach(([a,b,r])=>g.append(sv('circle',{cx:x*C+a,cy:y*C+b,r,fill:'#4fa23d'})));}else{g.append(sv('rect',{x:x*C+3,y:y*C+3,width:44,height:44,rx:8,fill:'#f4e1b3'}));if(ch==='S')start=[x,y];if(ch==='F')fin=[x,y];}}

    const put=(x,y,a)=>{man.setAttribute('transform',`translate(${x} ${y})`);man.querySelector('.ar').setAttribute('transform',`rotate(${a})`);};

        man.classList.add('walking');let [x,y]=start,d=s.dir,a=d*90;home();

            if(nx2<0||ny2<0||nx2>3||ny2>3||m[ny2][nx2]==='#'){await tw(300,q=>put(x0+[0,1,0,-1][d]*10*Math.sin(q*Math.PI),y0+[-1,0,1,0][d]*10*Math.sin(q*Math.PI),a));break;}
            await tw(380,q=>put(x0+(nx2-x)*C*q,y0+(ny2-y)*C*q,a));x=nx2;y=ny2;}
          else{const a0=a,a1=a+(t==='l'?-90:90);await tw(280,q=>put(x*C+25,y*C+25,a0+(a1-a0)*q));a=a1;d=(d+(t==='l'?3:1))%4;}}
        man.classList.remove('walking');
        if(ok){b.classList.add('right');award(1);fb.className='fb ok';fb.textContent='Ура! Чоловічок дійшов до прапорця.';confetti();}
        else{b.classList.add('wrong');bump(b);fb.className='fb bad';fb.textContent='Ой, не туди! Правильна програма виділена зеленим.';$$('.opt',o).forEach(x=>{if(x._p===right)x.classList.add('right');});}
        nx.hidden=false;};b._p=p;o.append(b);});
    c.append(o,fb,nx);}
  else if(s.k==='build'){pts.tot++;buildMaze(c,s);}

const LS='alg5-mini';
function lsGet(){try{return JSON.parse(localStorage.getItem(LS))||{names:[],tries:[]};}catch(e){return {names:[],tries:[]};}}
function lsSet(v){try{localStorage.setItem(LS,JSON.stringify(v));}catch(e){}}
function device(){const u=navigator.userAgent;const os=/Android/i.test(u)?'Android':/iPhone|iPad|iPod/i.test(u)?'iOS':/Windows/i.test(u)?'Windows':/Mac OS/i.test(u)?'macOS':/CrOS/i.test(u)?'ChromeOS':/Linux/i.test(u)?'Linux':'інша ОС';
  const br=/Edg\//.test(u)?'Edge':/OPR\//.test(u)?'Opera':/Firefox\//.test(u)?'Firefox':/Chrome\//.test(u)?'Chrome':/Safari\//.test(u)?'Safari':'інший браузер';
  return (/Mobi|Android|iPhone/i.test(u)?'телефон':'комп’ютер')+', '+os+', '+br+', екран '+screen.width+'×'+screen.height;}
const fmt=sec=>Math.floor(sec/60)+' хв '+String(sec%60).padStart(2,'0')+' с';
const num=x=>String(Math.round(x*10)/10).replace('.',',');
function report(grade,box){const sec=Math.round((Date.now()-U.t0)/1000);const who=U.name+' ('+U.cls+')';
  const st=lsGet();const others=st.names.filter(n=>n!==who);const prev=st.tries.map(t=>t.who+': '+t.grade+' б., '+t.when);
  const d=new Date(),pad=x=>String(x).padStart(2,'0');st.names=[...new Set(st.names.concat(who))];st.tries.push({who,grade,when:pad(d.getDate())+'.'+pad(d.getMonth()+1)+' '+pad(d.getHours())+':'+pad(d.getMinutes())});lsSet(st);
  const payload={token:TOKEN,test:TEST_NAME,sheet:SHEET_NAME,data:{'Учень':who,'Оцінка':grade,'Бали (з 15)':num(pts.got)+' з '+pts.tot,'Час виконання':fmt(sec),
    'Завдання':log.map((r,i)=>(i+1)+') '+num(r.g)+'/1 — '+r.t).join('\n'),'Пристрій':device(),'Інші імена на цьому пристрої':others.join('; ')||'—',
    'Попередні спроби на пристрої':prev.length?prev.length+': '+prev.join('; '):'—','IP-адреса':''}};
  const ipT=new Promise(r=>setTimeout(()=>r(''),3000));
  Promise.race([fetch('https://api.ipify.org?format=json').then(r=>r.json()).then(j=>j.ip||'').catch(()=>''),ipT]).then(ip=>{payload.data['IP-адреса']=ip||'—';send(payload,box);});}
function send(payload,box){box.className='send wait';box.textContent='Надсилаю результат учителю…';
  fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)})
  .then(()=>{box.className='send ok';box.textContent='✓ Результат надіслано вчителю.';})
  .catch(()=>{box.className='send bad';box.innerHTML='';box.append(document.createTextNode('Не вдалося надіслати. Перевір Інтернет і спробуй ще раз.'));const r=el('button',{class:'btn'},'Надіслати ще раз');r.onclick=()=>send(payload,box);box.append(r);});}

/* --- shared program strip --- */
function programUI(c,cmds,onRun){const prog=[];const strip=el('div',{class:'prog'});
  const redraw=()=>{strip.innerHTML='';if(!prog.length)strip.append(el('span',{class:'ph'},'Тут з\'явиться твоя програма'));prog.forEach(t=>strip.append(el('span',{class:'pc pc'+t},{f:'⬆',l:'↺',r:'↻'}[t])));};redraw();
  const ctl=el('div',{class:'ctl'});cmds.forEach(([t,cls,ic,lab])=>{const b=el('button',{class:'cmd '+cls},`<span>${ic}</span>${lab}`);b.onclick=()=>{if(prog.length<30){prog.push(t);redraw();}};ctl.append(b);});
  const ctl2=el('div',{class:'ctl2'});const un=el('button',{class:'undo'},'⌫ Стерти');un.onclick=()=>{prog.pop();redraw();};
  const go=el('button',{class:'go'},'▶ Запустити');ctl2.append(un,go);
  const lock=v=>[...ctl.children,un,go].forEach(b=>b.disabled=v);
  go.onclick=async()=>{if(!prog.length)return;lock(true);await onRun(prog,[...strip.children]);lock(false);};
  c.append(el('div',{style:'font-weight:800'},'Моя програма:'),strip,ctl,ctl2);
  return {prog,lock,redraw};}

const MAN='<ellipse cx="0" cy="16" rx="11" ry="3.5" fill="rgba(0,0,0,.18)"/><g class="bodyg"><rect x="-8" y="2" width="16" height="13" rx="5" fill="#2f6fe4"/><circle cy="-6" r="10" fill="#ffd9b0" stroke="#d9a877" stroke-width="1.5"/><path d="M-10-8q0-12 10-12t10 12q-4-5-10-5t-10 5z" fill="#e0711d"/><circle cx="-3.5" cy="-5" r="1.7" fill="#1b2433"/><circle cx="3.5" cy="-5" r="1.7" fill="#1b2433"/></g><g class="ar"><path d="M0-31 7-23H-7z" fill="#d23b3b" stroke="#fff" stroke-width="1.5"/></g>';
const DX=[0,1,0,-1],DY=[-1,0,1,0];
function buildMaze(c,s){const m=s.map,C=50;let tries=0,done=false;
  c.append(el('h2',{},s.q));
  const g=sv('svg',{class:'bmz',viewBox:'0 0 250 250',width:250,height:250,role:'img','aria-label':'Лабіринт'});c.append(g);
  const info=el('p',{class:'stars'});c.append(info);
  let start,fin,starCells=[];
  const paint=()=>{g.innerHTML='';g.append(sv('rect',{width:250,height:250,fill:'#5fae47'}));starCells=[];
    for(let y=0;y<5;y++)for(let x=0;x<5;x++){const ch=m[y][x];
      if(ch==='#'){[[14,16,12],[34,14,11],[24,32,13],[38,36,9]].forEach(([a,b,r])=>{g.append(sv('circle',{cx:x*C+a,cy:y*C+b+2,r,fill:'#3f8a33'}));g.append(sv('circle',{cx:x*C+a,cy:y*C+b,r,fill:'#4fa23d'}));});}

    const fl=sv('g',{transform:`translate(${fin[0]*C+20} ${fin[1]*C+42})`});fl.innerHTML='<path d="M0 0V-32" stroke="#5b4636" stroke-width="3"/><path d="M0-32q9-4 18 0t0 11q-9-4-18 0z" fill="#d23b3b"/>';g.append(fl);

  programUI(c,[['f','f','⬆','Вперед'],['l','l','↺','Ліворуч'],['r','r','↻','Праворуч']],async(prog,chips)=>{
    tries++;paint();fb.textContent='';fb.className='fb';let [x,y]=start,d=s.dir,a=d*90;let got=new Set();man.classList.add('walking');

        if(nx2<0||ny2<0||nx2>4||ny2>4||m[ny2][nx2]==='#'){await tw(300,q=>put(x0+DX[d]*12*Math.sin(q*Math.PI),y0+DY[d]*12*Math.sin(q*Math.PI),a));man.classList.remove('walking');chips[k]?.classList.remove('run');
          fb.className='fb bad';fb.textContent=`Ой, кущі! Команда №${k+1} веде в кущі. Натисни ⌫ і виправ програму.`;bump(c);skip();return;}
        await tw(360,q=>put(x0+DX[d]*C*q,y0+DY[d]*C*q,a));x=nx2;y=ny2;
        const key=`${x},${y}`;if(starCells.includes(key)&&!got.has(key)){got.add(key);const st=g.querySelector(`[data-star="${key}"]`);if(st)st.remove();info.textContent=`Зірочок: ${got.size} з ${starCells.length}`;}}

      fb.className='fb ok';fb.textContent=(got.size===starCells.length?'Супер! Усі зірочки зібрано і прапорець досягнуто! ':'Прапорець досягнуто! ')+`Команд у програмі: ${prog.length}.`;nx.hidden=false;}
    else{fb.className='fb bad';fb.textContent='Чоловічок зупинився, не дійшовши до прапорця. Додай команди.';}

    g.append(tt);const [sx,sy,sd]=s.start;put(sx*C+25,sy*C+25,sd*90);};
  paint();
  const fb=el('p',{class:'fb'});const nx=nextBtn();nx.hidden=true;
  const skip=()=>{if(tries>=2&&!done){nx.hidden=false;nx.textContent='Пропустити →';}};
  programUI(c,[['f','tf','⬆','Вперед'],['l','tl','↺','Ліворуч'],['r','tr','↻','Праворуч']],async(prog,chips)=>{
    tries++;paint();fb.textContent='';fb.className='fb';let [x,y,d]=s.start;let a=d*90;const drawn=new Set();tt.classList.add('walking');
    for(let k=0;k<prog.length;k++){const t=prog[k];chips[k]?.classList.add('run');
      if(t==='f'){const nx2=x+DX[d],ny2=y+DY[d];const x0=x*C+25,y0=y*C+25;
        if(nx2<0||ny2<0||nx2>4||ny2>4){await tw(300,q=>put(x0+DX[d]*10*Math.sin(q*Math.PI),y0+DY[d]*10*Math.sin(q*Math.PI),a));tt.classList.remove('walking');chips[k]?.classList.remove('run');fb.className='fb bad';fb.textContent=`Ой! Команда №${k+1} виводить Черепаху за край поля.`;bump(c);skip();return;}
        const ln=sv('line',{x1:x0,y1:y0,x2:x0,y2:y0,stroke:'#2f6fe4','stroke-width':6,'stroke-linecap':'round'});ink.append(ln);
        await tw(380,q=>{const cx=x0+DX[d]*C*q,cy=y0+DY[d]*C*q;ln.setAttribute('x2',cx);ln.setAttribute('y2',cy);put(cx,cy,a);});
        drawn.add(key([x,y],[nx2,ny2]));x=nx2;y=ny2;}
      else{const a0=a,a1=a+(t==='l'?-90:90);await tw(260,q=>put(x*C+25,y*C+25,a0+(a1-a0)*q));a=a1;d=(d+(t==='l'?3:1))%4;}
      chips[k]?.classList.remove('run');}
    tt.classList.remove('walking');
    const miss=[...target].filter(e=>!drawn.has(e)).length,extra=[...drawn].filter(e=>!target.has(e)).length;
    if(!miss&&!extra){if(!done){done=true;award(tries===1?1:.5);}confetti();fb.className='fb ok';fb.textContent=`Чудово! Намальовано точно. Команд: ${prog.length}.`;nx.hidden=false;}
    else{fb.className='fb bad';fb.textContent=extra?'Лінія пішла не туди. Натисни ⌫ і виправ програму.':'Ще не все намальовано. Додай команди.';bump(c);}
    skip();});
  c.append(fb,nx);}

window.addEventListener('beforeunload',e=>{if(U.t0&&si>0&&S[si].k!=='end'){e.preventDefault();e.returnValue='';}});
draw();
})();
